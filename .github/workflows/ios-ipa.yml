name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate TypeScript and unit tests
        run: |
          npm run typecheck
          npm test
          npx expo-doctor

      - name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install

      - name: Build unsigned release application
        run: |
          xcodebuild \
            -workspace ios/Throttle.xcworkspace \
            -scheme Throttle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package and inspect IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Throttle.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/UsageWidget.appex"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/Throttle.app
          (
            cd build
            ditto -c -k --sequesterRsrc --keepParent Payload \
              "Throttle-iOS-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          )
          unzip -l "build/Throttle-iOS-${GITHUB_RUN_NUMBER}-unsigned.ipa" \
            | grep "Payload/Throttle.app/PlugIns/UsageWidget.appex/"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Throttle-iOS-${{ github.run_number }}-unsigned
          path: ios-app/build/Throttle-iOS-${{ github.run_number }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
