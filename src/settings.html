<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Throttle</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Throttle</p>
      <h1>Dock services</h1>
      <p class="lede">Choose which usage rings appear on the right-side dock.</p>
    </header>

    <section class="toggles" aria-label="Dock services">
      <div class="service">
        <span class="service-mark claude" aria-hidden="true">
          <img src="assets/claude.svg" alt="">
        </span>
        <span class="service-copy">
          <strong>Claude</strong>
          <span>Claude Code usage</span>
        </span>
        <button id="show-claude" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Show Claude on the dock"></button>
      </div>

      <div class="service">
        <span class="service-mark cursor" aria-hidden="true">
          <img src="assets/cursor.svg" alt="">
        </span>
        <span class="service-copy">
          <strong>Cursor</strong>
          <span>Cursor included usage</span>
        </span>
        <button id="show-cursor" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Show Cursor on the dock"></button>
      </div>

      <div class="service">
        <span class="service-mark codex" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.911 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.182a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.91 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.989 5.989 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zm-9.022 12.608a4.476 4.476 0 0 1-2.876-1.04l.142-.081 4.778-2.758a.795.795 0 0 0 .393-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.495 4.494zM3.599 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.758a.771.771 0 0 0 .781 0l5.843-3.368v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.141-1.646zM2.341 7.896a4.485 4.485 0 0 1 2.365-1.972V11.6a.766.766 0 0 0 .388.676l5.814 3.355-2.02 1.168a.076.076 0 0 1-.071 0L4.0 14.014A4.504 4.504 0 0 1 2.34 7.872zm16.596 3.855-5.833-3.387 2.015-1.164a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.104v-5.677a.79.79 0 0 0-.407-.667zm2.011-3.023-.142-.085-4.773-2.782a.776.776 0 0 0-.786 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061L14.268 4.05a4.5 4.5 0 0 1 6.68 4.66zM8.307 12.863l-2.02-1.164a.08.08 0 0 1-.038-.057V6.074a4.5 4.5 0 0 1 7.375-3.454l-.142.081L8.704 5.459a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"></path></svg>
        </span>
        <span class="service-copy">
          <strong>Codex</strong>
          <span>ChatGPT Codex usage</span>
        </span>
        <button id="show-codex" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Show Codex on the dock"></button>
      </div>

      <div class="service">
        <span class="service-mark antigravity" aria-hidden="true">
          <img src="assets/antigravity.png" alt="">
        </span>
        <span class="service-copy">
          <strong>Antigravity</strong>
          <span>Antigravity CLI quota</span>
        </span>
        <button id="show-antigravity" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Show Antigravity on the dock"></button>
      </div>
    </section>

    <section class="extras" aria-label="Preferences">
      <div class="row">
        <label for="interval">Auto-refresh</label>
        <select id="interval">
          <option value="10">10 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">1 minute</option>
          <option value="300">5 minutes</option>
        </select>
      </div>
      <div class="row">
        <label for="opacity">Dock opacity</label>
        <input id="opacity" type="range" min="35" max="100" step="1" value="92">
        <output id="opacity-value" for="opacity">92%</output>
      </div>
      <div class="actions">
        <button id="update" type="button">Check for updates</button>
        <button id="mobile-pairing" type="button">Pair with Tailscale</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="settings-window.js"></script>
</body>
</html>
