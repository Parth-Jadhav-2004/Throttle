<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Throttle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-dock-state="hidden">
  <div class="dock-shell">
    <div id="tooltip" class="usage-tooltip" hidden aria-hidden="true">
      <div class="usage-tooltip-header">
        <span class="usage-tooltip-icon" id="tooltip-icon" aria-hidden="true"></span>
        <span id="tooltip-title">Usage</span>
      </div>
      <div id="tooltip-rows"></div>
    </div>

    <aside id="dock" class="dock" aria-label="Throttle usage">
      <svg class="dock-shape" viewBox="0 0 104 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M104 0C104 2 100 6 88 8C62 12 16 6 10 18C4 30 4 70 10 82C16 94 62 88 88 92C100 94 104 98 104 100Z"></path>
      </svg>
      <button class="slot" id="slot-claude" type="button" data-provider="claude" aria-label="Claude usage">
        <span class="ring">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27"></circle>
            <circle id="claude-ring" class="progress" cx="32" cy="32" r="27"></circle>
          </svg>
          <span class="logo" aria-hidden="true"><img src="assets/claude.svg" alt=""></span>
        </span>
        <span class="pct" id="claude-pct">—</span>
      </button>

      <button class="slot" id="slot-cursor" type="button" data-provider="cursor" aria-label="Cursor usage">
        <span class="ring">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27"></circle>
            <circle id="cursor-ring" class="progress" cx="32" cy="32" r="27"></circle>
          </svg>
          <span class="logo cursor-logo" aria-hidden="true"><img src="assets/cursor.svg" alt=""></span>
        </span>
        <span class="pct" id="cursor-pct">—</span>
      </button>

      <button class="slot" id="slot-codex" type="button" data-provider="codex" aria-label="Codex usage">
        <span class="ring">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27"></circle>
            <circle id="codex-ring" class="progress" cx="32" cy="32" r="27"></circle>
          </svg>
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.911 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.182a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.91 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.989 5.989 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zm-9.022 12.608a4.476 4.476 0 0 1-2.876-1.04l.142-.081 4.778-2.758a.795.795 0 0 0 .393-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.495 4.494zM3.599 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.758a.771.771 0 0 0 .781 0l5.843-3.368v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.141-1.646zM2.341 7.896a4.485 4.485 0 0 1 2.365-1.972V11.6a.766.766 0 0 0 .388.676l5.814 3.355-2.02 1.168a.076.076 0 0 1-.071 0L4.0 14.014A4.504 4.504 0 0 1 2.34 7.872zm16.596 3.855-5.833-3.387 2.015-1.164a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.104v-5.677a.79.79 0 0 0-.407-.667zm2.011-3.023-.142-.085-4.773-2.782a.776.776 0 0 0-.786 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061L14.268 4.05a4.5 4.5 0 0 1 6.68 4.66zM8.307 12.863l-2.02-1.164a.08.08 0 0 1-.038-.057V6.074a4.5 4.5 0 0 1 7.375-3.454l-.142.081L8.704 5.459a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"></path></svg>
          </span>
        </span>
        <span class="pct" id="codex-pct">—</span>
      </button>

      <button class="slot" id="slot-antigravity" type="button" data-provider="antigravity" aria-label="Antigravity usage">
        <span class="ring">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27"></circle>
            <circle id="antigravity-ring" class="progress" cx="32" cy="32" r="27"></circle>
          </svg>
          <span class="logo antigravity-logo" aria-hidden="true">
            <img src="assets/antigravity.png" alt="">
          </span>
        </span>
        <span class="pct" id="antigravity-pct">—</span>
      </button>
    </aside>

    <button class="settings-float" id="open-settings" type="button" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
  <script src="usage-tooltip.browser.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
